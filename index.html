<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>이상형 벨런스게임</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>이상형 벨런스게임</h1>
        <div id="game-container">
            <div id="start-container">
                <p>이상형 벨런스게임을 통해 당신의 이상형을 분석해보세요!</p>
                <button id="start-btn" class="option-btn">게임 시작</button>
                <button id="preview-btn" class="option-btn" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">질문 미리보기</button>
            </div>
            <div id="question-container" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                    <span class="progress-text" id="progress-text">1 / 15</span>
                </div>
                <p id="question-text">질문이 여기에 표시됩니다</p>
                <div class="options">
                    <button id="option1" class="option-btn">선택지 1</button>
                    <button id="option2" class="option-btn">선택지 2</button>
                </div>
                <button id="prev-btn" class="prev-btn">이전</button>
            </div>
            <div id="preview-container" style="display: none;">
                <h2>질문 목록</h2>
                <div id="preview-list"></div>
                <button id="back-btn" class="restart-btn">돌아가기</button>
            </div>
            <div id="result-container" style="display: none;">
                <h2>당신의 이상형 분석결과</h2>
                <div class="profile-card" id="result-card">
                    <div class="profile-header">
                        <div class="profile-icon">💕</div>
                        <h3 id="type-title">이상형 타입</h3>
                        <p id="type-description">타입 설명</p>
                    </div>
                    <div class="profile-details">
                        <h4>이상형 한 줄 요약</h4>
                        <p id="result-summary" class="result-summary"></p>
                    </div>
                </div>
                <div class="button-group">
                    <button id="share-btn" class="restart-btn share-btn">공유하기</button>
                    <button id="restart-btn" class="restart-btn">다시 하기</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
